name: Client auf Netcup ausrollen

# Lädt nur den Client-Teil (index.html, css/, js/, icons/, ...) per FTP nach
# gin-werkstatt.de/GinCheckOne hoch, sobald sich an diesen Dateien auf "main"
# etwas ändert. Der PHP-Server-Teil (server/) wird bewusst NICHT mit
# ausgerollt - server/config.php liegt nur auf dem Webspace (nicht im Repo)
# und darf durch ein automatisches Deployment nicht angefasst werden.
#
# Läuft über klassisches FTP, weil SFTP für diesen Netcup-Zugang nicht
# funktioniert (getestet). Die Secret-Namen sind noch von einem früheren
# SFTP-Versuch übrig geblieben (NETCUP_SFTP_...), enthalten inhaltlich aber
# jetzt die FTP-Zugangsdaten - Umbenennen würde nur unnötigen Aufwand
# bedeuten, ist aber jederzeit möglich.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.htaccess'
      - 'Logo-Ginwerkstatt.svg'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Nur Client-Dateien zusammenstellen
        run: |
          mkdir -p deploy
          cp index.html manifest.webmanifest sw.js .htaccess Logo-Ginwerkstatt.svg deploy/
          cp -r css js icons deploy/

      - name: Per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NETCUP_SFTP_HOST }}
          port: ${{ secrets.NETCUP_SFTP_PORT }}
          username: ${{ secrets.NETCUP_SFTP_USER }}
          password: ${{ secrets.NETCUP_SFTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy/
          server-dir: ${{ secrets.NETCUP_SFTP_REMOTE_PATH }}
          dangerous-clean-slate: false
